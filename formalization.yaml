# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Wagner's planarity criterion and list colouring of planar and K5-minor-free graphs"
  description: >-
    A Lean 4 / Mathlib formalization of classical results on planar graphs and graphs without a
    K5 minor. (1) Wagner's theorem (1937): a finite graph is planar if and only if it has neither
    K5 nor K3,3 as a minor. (2) Škrekovski's theorem (1998): every finite graph without a K5
    minor is 5-choosable, proved along the route of Wood and Linusson, and Thomassen's theorem
    (1994) that every finite planar graph is 5-choosable, as a corollary. (3) DP-colouring: every
    finite graph without a K5 minor (Li–Wang, 2022), hence every finite planar graph
    (Dvořák–Postle, 2018), is DP-5-colourable. (4) Voigt's theorem (1993): an explicit planar
    graph on 238 vertices with lists of four colours has no proper list colouring, so 5 cannot be
    lowered to 4; its planarity and non-colourability are checked by kernel reduction. (5) Wagner's
    equivalence of the Four Colour Theorem with Hadwiger's conjecture for K5 (neither side is
    proved). Planarity is defined combinatorially, by rotation systems of genus zero (Euler
    defect 0); as sanity checks K4 is planar and K5, K3,3 are not.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C10", "05C15", "05C83"]

sources:
