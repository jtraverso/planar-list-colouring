status:
  scope: >-
    Proved for finite simple graphs (vertex types in any universe; Voigt's example on Fin 238):
    Wagner's characterization of planarity by excluded K5 and K3,3 minors, 5-choosability and
    DP-5-colourability of K5-minor-free graphs and of planar graphs, a planar graph that is not
    4-choosable, and the equivalence of the Four Colour Theorem with Hadwiger's conjecture for K5
    (neither of which is proved). Planarity means the existence of a genus-zero rotation system;
    its equivalence with topological embeddability in the sphere is classical but not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "autonomous"
      models: ["Aristotle (Harmonic)"]
      framework: "Aristotle CLI"
      tool_setup: >-
        Most proofs of the library (the Wood–Linusson extension lemma, the K5- and
        K3,3-minor-free decompositions behind Wagner's theorem, Voigt's certificate) were produced
        by Aristotle over several rounds from the author's statements and proof plans; every
        return was audited (statements unchanged, no added axioms) and rebuilt locally.
      cost:
        wall_time: "several days over multiple rounds"
        spend_usd: "not tracked"
        hardware: "API-only"
      prompting_notes: "Formal statements, task descriptions and proof plans supplied for each round."
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design, integration and review of the rounds, and the Palomar packaging
        (Challenge with copied definitions of planarity, minors, list and DP colouring; Solution
        with bridges to the library), checked with `lake build` and `#print axioms` (Lean
        v4.35.0-rc3, Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The results, routes and statements were chosen by the human author; the Lean proofs are
    AI-generated and mechanically verified (no `sorry`, axioms limited to propext,
    Classical.choice and Quot.sound, identical elaborated types for each Challenge/Solution
    pair). One library file (`Wagner/K33AttachmentAttack.lean`) raises `maxHeartbeats` for two
    declarations. Some module docstrings record the history of the development (for instance the
    header of `Wagner/WagnerB.lean` describes an earlier conditional stage); the closing exports
    are in `Wagner/WagnerV8Core.lean` and `Wagner/WagnerA.lean`, and the statements here depend on
    no unproved hypothesis.

fidelity:
  divergences: >-
    Planarity is the combinatorial notion (genus-zero rotation system), not a topological
    embedding; the classical equivalence is not formalized. Minors are given by branch-set models
    (disjoint nonempty connected branch sets with edges between the branch sets of adjacent
    vertices). List colourings use an arbitrary colour type; DP-colourings use a correspondence
    given as a symmetric family of partial matchings between colours for every pair of vertices.
    Voigt's theorem is stated as the existence of a finite planar graph that is not 4-choosable
    (with colours in ℕ).

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent compared
    each Challenge statement with the cited sources, checked the copied definitions of planarity,
    minors, list colouring and DP-colouring against the library through explicit bridge lemmas,
    checked that the 69 vendored modules are byte-identical to the integrated library sources, and
    confirmed by `lake build`, `#print axioms` and a comparison of the fully elaborated Challenge
    and Solution types that the proofs use no `sorry` and only propext, Classical.choice and
    Quot.sound. The Aristotle returns that produced the library were audited by diff when they
    were integrated. The author directed the work and approved the statements. No independent
    human mathematical review has been performed. The results are classical and no mathematical
    novelty is claimed.

