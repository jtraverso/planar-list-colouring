    authors:
      - "Klaus Wagner"
    type: "paper"
    location: "Mathematische Annalen 114 (1937), 570–590"
    relationship: "formalizes"
    note: >-
      The minor characterization of planarity (no K5 and no K3,3 minor) and the equivalence of
      the Four Colour Theorem with Hadwiger's conjecture for K5. The Lean proof of the
      characterization goes through a decomposition of K5-minor-free and K3,3-minor-free graphs
      along small clique separations and does not follow the original argument line by line.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Sur le problème des courbes gauches en topologie"
    authors:
      - "Kazimierz Kuratowski"
    type: "paper"
    location: "Fundamenta Mathematicae 15 (1930), 271–283"
    relationship: "background"
    note: "Kuratowski's subdivision characterization of planarity; the subdivision form is not formalized here."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Choosability of K5-minor-free graphs"
    authors:
      - "Riste Škrekovski"
    id: "doi:10.1016/S0012-365X(98)00158-7"
    type: "paper"
    location: "Discrete Mathematics 190 (1998), 223–226"
    relationship: "formalizes"
    note: "Every K5-minor-free graph is 5-choosable; the Lean proof follows Wood–Linusson rather than the original argument."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Thomassen's Choosability Argument Revisited"
    authors:
      - "David R. Wood"
      - "Svante Linusson"
    id: "arXiv:1005.5194"
    type: "paper"
    location: "SIAM Journal on Discrete Mathematics 24 (2010), no. 4, 1632–1637"
    relationship: "formalizes"
    note: "Lemma 7 (list colouring with a prescribed clique and boundary lists) is formalized and used for the K5-minor-free theorem."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Every planar graph is 5-choosable"
    authors:
      - "Carsten Thomassen"
    type: "paper"
    location: "Journal of Combinatorial Theory, Series B 62 (1994), 180–181"
    relationship: "formalizes"
    note: "Obtained here as a corollary of the K5-minor-free theorem, since planar graphs have no K5 minor."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Correspondence coloring and its application to list-coloring planar graphs without cycles of lengths 4 to 8"
    authors:
      - "Zdeněk Dvořák"
      - "Luke Postle"
    type: "paper"
    location: "Journal of Combinatorial Theory, Series B 129 (2018), 38–54"
    relationship: "formalizes"
    note: "Introduces correspondence (DP) colouring and observes that planar graphs are DP-5-colourable."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "An extension of Thomassen's result on choosability"
    authors:
      - "Lingxi Li"
      - "Tao Wang"
    id: "arXiv:2111.15220"
    type: "paper"
    location: "Applied Mathematics and Computation 425 (2022), 127100"
    relationship: "formalizes"
    note: "Every K5-minor-free graph is DP-5-colourable (the K3,3-minor-free case is not included in this entry)."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "List colourings of planar graphs"
    authors:
      - "Margit Voigt"
    id: "doi:10.1016/0012-365X(93)90579-I"
    type: "paper"
    location: "Discrete Mathematics 120 (1993), 215–219"
    relationship: "formalizes"
    note: >-
      A planar graph that is not 4-choosable. The Lean development uses an explicit 238-vertex
      graph, a rotation system for it and explicit lists of four colours, checked by kernel
      reduction (`decide +kernel`, no `native_decide`).
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "A combinatorial representation for polyhedral surfaces"
